<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="signupform.css">
</head>
<body>

    <h1>Sign Up Form</h1>

    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" size="15" placeholder="Enter your name" required>
        <p>Enter your name</p>
        <br><br>

        <label for="college">College:</label>
        <input type="text" id="college" size="15" placeholder="Enter your college" disabled>
        <p>Enter your college</p>
        <br><br>

        <label for="primary-email">Primary Email:</label>
        <input type="email" id="primary-email" size="15" placeholder="Enter your email" required>
        <img class="invalid" src="https://img.magnific.com/premium-vector/exclamation-point-icon-flat-illustration-exclamation-point-vector-icon-web_98396-5719.jpg?semt=ais_hybrid&w=740&q=80" alt="Invalid input">
        <img class="valid" src="https://img.magnific.com/premium-vector/green-check-mark-symbol-circle-signifying-approval-confirmation-validation_1256898-1434.jpg?semt=ais_hybrid&w=740&q=80" alt="Valid input">
        <p>Enter your primary email</p>
        <br>

        <label for="secondary-email">Secondary Email:</label>
        <input type="email" id="secondary-email" size="15" placeholder="Enter your email">
        <p>Enter your secondary email</p>
        <br>

        <label for="password">Password:</label>
        <input type="password" id="password" size="15" placeholder="Enter your password" required>
        <p>Enter your password</p>
        <br><br>

        <label>Gender:</label>
        <input type="radio" id="male" name="gender" value="male" required>
        <label class="gender-label" for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female" required>
        <label class="gender-label" for="female">Female</label>
        <p>Enter your gender</p>
        <br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" min="18" max="40" placeholder="Enter your age" required>
        <p>Enter your age</p>
        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" required>
        <p>Enter your date of birth</p>
        <br><br>

        <label for="mod">MOD:</label>
        <input type="text" id="mod" size="15" placeholder="Enter your MOD" disabled>
        <p>Online MOD is available</p>
        <br><br>

        <label for="submit">Submit:</label>
        <input type="submit" id="submit" value="Submit">
        <p>Click to submit the form</p>
    </form>

</body>
</html>
